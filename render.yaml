# Blueprint Render pour le déploiement du projet pédagogique Pollution
# Inclut la base de données PostgreSQL, l'API Node.js/TypeScript et le Frontend Angular

databases:
  - name: pollution-db
    databaseName: pollution_db
    user: pollution_user
    plan: free
    region: oregon

services:
  # -------------------------------------------------------------
  # API Backend Node.js / Express / Sequelize / TypeScript
  # URL attendue par le Front : https://projet-vallet-luca-api.onrender.com/api
  # -------------------------------------------------------------
  - type: web
    name: projet-vallet-luca-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString

  # -------------------------------------------------------------
  # Application Frontend Angular (Site Statique)
  # -------------------------------------------------------------
  - type: web
    name: projet-vallet-luca-front
    runtime: static
    rootDir: Front
    buildCommand: npm install && npm run build
    staticPublishPath: dist/front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
