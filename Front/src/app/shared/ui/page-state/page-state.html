<div class="state" [attr.data-kind]="kind" [attr.role]="kind === 'error' ? 'alert' : null">
  <span class="state__icon" aria-hidden="true">
    @switch (kind) {
      @case ('error') {
        <svg viewBox="0 0 24 24">
          <path d="M12 4l9 16H3z" />
          <path d="M12 10v4M12 17v.5" />
        </svg>
      }
      @case ('search') {
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24">
          <path d="M12 3c3.9 4.8 6.5 8.6 6.5 12a6.5 6.5 0 01-13 0c0-3.4 2.6-7.2 6.5-12z" />
        </svg>
      }
    }
  </span>
  <p class="state__title">{{ heading }}</p>
  @if (message) {
    <p class="state__message">{{ message }}</p>
  }
  <div class="state__actions">
    <ng-content />
  </div>
</div>
