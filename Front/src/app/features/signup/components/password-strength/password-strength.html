<div class="strength" [attr.data-score]="score">
  <div class="strength__header">
    <span class="strength__title">Robustesse</span>
    <span class="strength__level">{{ password ? levelLabel : '—' }}</span>
  </div>

  <div
    class="strength__bar"
    role="meter"
    aria-label="Robustesse du mot de passe"
    aria-valuemin="0"
    aria-valuemax="4"
    [attr.aria-valuenow]="score"
    [attr.aria-valuetext]="levelLabel"
  >
    @for (segment of segments; track segment) {
      <span class="strength__segment" [class.strength__segment--on]="segment <= score"></span>
    }
  </div>

  <ul class="strength__rules">
    @for (rule of rules; track rule.id) {
      <li class="strength__rule" [class.strength__rule--valid]="rule.valid">
        <span class="strength__check" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M4 8.5l2.5 2.5L12 5.5" /></svg>
        </span>
        {{ rule.label }}
        <span class="visually-hidden">{{ rule.valid ? '(respectée)' : '(non respectée)' }}</span>
      </li>
    }
  </ul>
</div>
