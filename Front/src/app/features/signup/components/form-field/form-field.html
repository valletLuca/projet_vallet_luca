<div class="field" [class.field--invalid]="errorMessage">
  <div class="field__control">
    <ng-content />
    <label class="field__label" [for]="fieldId">{{ label }}</label>
  </div>
  <p class="field__error" [id]="fieldId + '-error'" aria-live="polite">
    @if (errorMessage; as message) {
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.5v4M8 11v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      {{ message }}
    }
  </p>
</div>
