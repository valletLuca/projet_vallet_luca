<div class="picker" [class.picker--invalid]="error">
  @if (file) {
    <div class="picker__selected">
      <app-photo-preview
        [url]="previewUrl"
        [alt]="'Photo sélectionnée : ' + file.name"
        errorLabel="Aperçu indisponible pour ce format"
      />
      <div class="picker__meta">
        <div class="picker__file">
          <span class="picker__name" [title]="file.name">{{ file.name }}</span>
          <span class="picker__size">{{ fileSize }}</span>
        </div>
        <div class="picker__actions">
          <label class="picker__action" [for]="inputId">Changer</label>
          <button type="button" class="picker__action picker__action--danger" (click)="remove()">
            Retirer
          </button>
        </div>
      </div>
    </div>
  } @else {
    <label
      class="picker__drop"
      [class.picker__drop--dragging]="dragging"
      [for]="inputId"
      (dragover)="onDragOver($event)"
      (dragleave)="dragging = false"
      (drop)="onDrop($event)"
    >
      <span class="picker__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 15V4M7.5 8.5L12 4l4.5 4.5" />
          <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" />
        </svg>
      </span>
      <span class="picker__title">Choisir une photo</span>
      <span class="picker__hint">
        <span class="picker__hint-drag">ou glissez-la ici · </span>JPEG, PNG, WebP, HEIC · 5 Mo max
      </span>
    </label>
  }

  <input
    type="file"
    accept="image/*,.heic,.heif"
    class="picker__input"
    [id]="inputId"
    [attr.aria-describedby]="inputId + '-error'"
    [attr.aria-invalid]="!!error"
    (change)="onInputChange($event)"
  />

  <p class="field__error picker__error" [id]="inputId + '-error'" aria-live="polite">
    @if (error) {
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.5v4M8 11v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      {{ error }}
    }
  </p>
</div>
