<figure class="preview" [attr.data-status]="status">
  @if (status === 'empty') {
    <div class="preview__state">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <circle cx="9" cy="10" r="1.6" />
        <path d="M21 16l-5-5-8 8" />
      </svg>
      <span>Aucune photo</span>
    </div>
  } @else {
    <img
      class="preview__image"
      [src]="src"
      [alt]="alt"
      (load)="status = 'loaded'"
      (error)="status = 'error'"
    />
    @if (status === 'loading') {
      <div class="preview__skeleton" role="status">
        <span class="visually-hidden">Chargement de l'image…</span>
      </div>
    }
    @if (status === 'error') {
      <div class="preview__state preview__state--error" role="status">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M9.5 9.5l5 5M14.5 9.5l-5 5" />
        </svg>
        <span>{{ errorLabel }}</span>
      </div>
    }
  }
</figure>
