<form [formGroup]="form" (ngSubmit)="onSubmit()" class="sign-up-form" [attr.aria-busy]="pending">
  <app-form-field
    label="Adresse e-mail"
    fieldId="email"
    [control]="controls.email"
    [messages]="{
      required: 'L\'adresse e-mail est requise.',
      email: 'Cette adresse e-mail n\'est pas valide.',
    }"
  >
    <input
      id="email"
      type="email"
      class="field__input"
      placeholder=" "
      inputmode="email"
      autocomplete="email"
      formControlName="email"
      [attr.aria-invalid]="controls.email.invalid && controls.email.touched"
      aria-describedby="email-error"
    />
  </app-form-field>

  <app-form-field
    label="Mot de passe"
    fieldId="password"
    [control]="controls.password"
    [messages]="{ required: 'Le mot de passe est requis.' }"
  >
    <input
      id="password"
      type="password"
      class="field__input"
      placeholder=" "
      autocomplete="current-password"
      formControlName="password"
      [attr.aria-invalid]="controls.password.invalid && controls.password.touched"
      aria-describedby="password-error"
    />
  </app-form-field>

  @if (errorMessage; as message) {
    <div class="alert" role="alert">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="7" />
        <path d="M8 4.5v4M8 11v.5" />
      </svg>
      <p class="alert__text">
        <strong>Connexion impossible</strong>
        {{ message }}
      </p>
    </div>
  }

  <div class="actions">
    <button type="submit" class="btn btn--primary" [disabled]="pending || form.invalid">
      @if (pending) {
        <span class="spinner" aria-hidden="true"></span>
        Connexion…
      } @else {
        Se connecter
      }
    </button>
  </div>
</form>

<p class="card__footer">Pas encore de compte ? <a routerLink="/inscription">En créer un</a></p>
